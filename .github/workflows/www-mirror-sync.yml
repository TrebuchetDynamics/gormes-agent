name: www mirror sync check

on:
  pull_request:
    paths:
      - 'docs/content/building-gormes/architecture_plan/progress.json'
      - 'www.gormes.ai/src/data/progress.json'
      - 'www.gormes.ai/scripts/sync-assets.mjs'
      - 'benchmarks.json'
      - 'www.gormes.ai/src/data/benchmarks.json'
  push:
    branches: [main, development]
    paths:
      - 'docs/content/building-gormes/architecture_plan/progress.json'
      - 'www.gormes.ai/src/data/progress.json'
      - 'www.gormes.ai/scripts/sync-assets.mjs'
      - 'benchmarks.json'
      - 'www.gormes.ai/src/data/benchmarks.json'

permissions:
  contents: read

concurrency:
  group: www-mirror-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror-in-sync:
    name: mirror-in-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: www.gormes.ai/package-lock.json

      - name: Install dependencies
        working-directory: www.gormes.ai
        run: npm ci

      - name: Run www mirror sync
        run: |
          cd www.gormes.ai
          npm run prebuild

      - name: Verify mirror matches canonical
        env:
          GIT_PAGER: cat
        run: |
          git diff --exit-code www.gormes.ai/src/data/progress.json
          git diff --exit-code www.gormes.ai/src/data/benchmarks.json
