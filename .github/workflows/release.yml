name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without leading v, for example 0.1.0'
        required: true
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            webpages/docs/package-lock.json
            webpages/blog/package-lock.json
            webpages/landing/package-lock.json

      - name: Download modules
        run: go mod download

      - name: Install docs dependencies
        working-directory: webpages/docs
        run: npm ci

      - name: Install blog dependencies
        working-directory: webpages/blog
        run: npm ci

      - name: Install landing dependencies
        working-directory: webpages/landing
        run: npm ci

      - name: Run Go tests
        run: go test ./... -count=1

      - name: Run core race tests
        run: go test -race ./internal/kernel ./internal/gateway ./internal/adapters/channels/navivox ./internal/adapters/apiserver -count=1

      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

      - name: Test engineering blog
        working-directory: webpages/blog
        run: npm run test

      - name: Build docs site
        working-directory: webpages/docs
        run: npm run build

      - name: Test landing data and asset sync
        working-directory: webpages/landing
        run: npm run test:data && npm run test:sync-assets

      - name: Build landing site
        working-directory: webpages/landing
        run: npm run build

      - name: Validate progress
        run: go run ./cmd/progress validate

      - name: Check whitespace
        run: git diff --check

      - name: Verify release version matches code
        run: |
          code_version=$(grep 'var Version =' cmd/gormes/main.go | sed 's/.*"\(.*\)".*/\1/')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            requested_version="${{ inputs.version }}"
          else
            requested_version="${GITHUB_REF_NAME#v}"
          fi
          if [ "$requested_version" != "$code_version" ]; then
            echo "Version mismatch: requested=$requested_version, code=$code_version"
            exit 1
          fi

  build:
    name: build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            os: ubuntu-latest
          - goos: linux
            goarch: arm64
            os: ubuntu-latest
          - goos: darwin
            goarch: amd64
            os: macos-latest
          - goos: darwin
            goarch: arm64
            os: macos-latest
          - goos: windows
            goarch: amd64
            os: ubuntu-latest
          - goos: windows
            goarch: arm64
            os: ubuntu-latest
          - goos: android
            goarch: arm64
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build static binary archive
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          target="gormes-${VERSION}-${GOOS}-${GOARCH}"
          exe="gormes"
          if [ "$GOOS" = "windows" ]; then
            exe="gormes.exe"
          fi
          mkdir -p "dist/${target}"
          # Resolve build-time provenance for `gormes version --json`.
          # SHA falls back to "unknown" on shallow clones or detached
          # states; dirty falls back to "false". The build never fails
          # because of a metadata lookup.
          GIT_COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          if git diff --quiet 2>/dev/null && git diff --cached --quiet 2>/dev/null; then
            GIT_DIRTY=false
          else
            GIT_DIRTY=true
          fi
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
            go build -trimpath -ldflags="-s -w -X main.Version=${VERSION} -X main.GitCommit=${GIT_COMMIT} -X main.GitDirty=${GIT_DIRTY} -X main.BuildDate=${BUILD_DATE}" \
              -o "dist/${target}/${exe}" ./cmd/gormes
          binary_path="dist/${target}/${exe}"
          if [ "$GOOS" = "$(go env GOHOSTOS)" ] && [ "$GOARCH" = "$(go env GOHOSTARCH)" ]; then
            version_json=$("$binary_path" version --json)
            printf '%s\n' "$version_json" | grep "\"version\": \"${VERSION}\""
            printf '%s\n' "$version_json" | grep "\"git_commit\": \"${GIT_COMMIT}\""
            printf '%s\n' "$version_json" | grep "\"git_dirty\": ${GIT_DIRTY}"
            printf '%s\n' "$version_json" | grep "\"build_date\": \"${BUILD_DATE}\""
          else
            go version -m "$binary_path" >/dev/null
          fi
          archive="dist/${target}.tar.gz"
          tar -C dist -czf "$archive" "${target}"
          sha256sum "$archive" > "${archive}.sha256"
          max_archive_bytes=31457280
          actual_archive_bytes=$(wc -c < "$archive" | tr -d '[:space:]')
          if [ "$actual_archive_bytes" -gt "$max_archive_bytes" ]; then
            echo "::error file=${archive},title=Release archive exceeds 30 MiB::${archive} bytes=${actual_archive_bytes} max=${max_archive_bytes}"
            exit 1
          fi

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          output-file: dist/gormes-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.sbom.json
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/gormes-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          sbom-path: dist/gormes-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.sbom.json

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/gormes-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: gormes-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.sbom.json
          if-no-files-found: error

  publish:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Stage install scripts as release assets
        shell: bash
        run: |
          set -euo pipefail
          # Bundle install.sh and install.ps1 alongside the platform
          # tarballs so the canonical release URL pattern works:
          #   curl -fsSL https://github.com/.../releases/download/${TAG}/install.sh
          # Without this, users following the natural release URL hit
          # 404 instead of staying on GitHub's release trust surface.
          cp install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1

      - name: Build release notes
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          date_alias=$(grep 'var VersionDateAlias =' cmd/gormes/main.go | sed 's/.*"\(.*\)".*/\1/')
          test -n "$date_alias"
          echo "date_alias=$date_alias" >> "$GITHUB_OUTPUT"
          {
            echo "# Gormes ${GITHUB_REF_NAME} (${date_alias})"
            echo ""
            echo "## Install"
            echo '```bash'
            echo "# Linux/macOS/WSL2 (downloads release binary)"
            echo "curl -fsSL https://github.com/TrebuchetDynamics/gormes-agent/releases/download/${GITHUB_REF_NAME}/install.sh | sh"
            echo '```'
            echo '```powershell'
            echo "# Native Windows"
            echo "irm https://github.com/TrebuchetDynamics/gormes-agent/releases/download/${GITHUB_REF_NAME}/install.ps1 -OutFile install.ps1"
            echo "powershell -ExecutionPolicy Bypass -File .\\install.ps1"
            echo '```'
            echo ""
            echo "Or download a platform tarball directly:"
            echo '```bash'
            echo "# Linux amd64"
            echo "curl -LO https://github.com/TrebuchetDynamics/gormes-agent/releases/download/${GITHUB_REF_NAME}/gormes-${version}-linux-amd64.tar.gz"
            echo '```'
            echo ""
            echo "## Artifacts"
            echo "| Platform | Archive | Size | SHA-256 |"
            echo "|----------|---------|------|---------|"
            for f in dist/*.tar.gz; do
              name=$(basename "$f")
              size=$(wc -c < "$f" | tr -d '[:space:]')
              sha=$(cat "${f}.sha256" | awk '{print $1}')
              echo "| ${name%.tar.gz} | [$name]($name) | \`${size} bytes\` | \`${sha}\` |"
            done
            echo ""
            echo "## SBOM"
            echo "Software Bill of Materials (SPDX JSON) is included for each platform artifact."
            echo ""
            echo "## Verification"
            echo "SBOM and build-provenance attestations are published to the GitHub Attestations store."
            echo ""
            echo "## Changes"
            echo "See [CHANGELOG.md](https://github.com/TrebuchetDynamics/gormes-agent/blob/main/CHANGELOG.md) for full details."
          } > release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          name: Gormes ${{ github.ref_name }} (${{ steps.release_notes.outputs.date_alias }})
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.sbom.json
            dist/install.sh
            dist/install.ps1
          body_path: release-notes.md
