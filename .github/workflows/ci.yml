name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            webpages/docs/package-lock.json
            webpages/blog/package-lock.json

      - name: Download modules
        run: go mod download

      - name: Install docs dependencies
        working-directory: webpages/docs
        run: npm ci

      - name: Install blog dependencies
        working-directory: webpages/blog
        run: npm ci

      - name: Run Go tests
        run: go test ./... -count=1

      - name: Test engineering blog
        working-directory: webpages/blog
        run: npm run test

      - name: Validate progress
        run: go run ./cmd/progress validate

      - name: Check whitespace
        run: git diff --check

  navivox:
    name: navivox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test Navivox Go gateway
        run: go test ./internal/adapters/channels/navivox -count=1
