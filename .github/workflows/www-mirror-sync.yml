name: www mirror sync check

on:
  pull_request:
    paths:
      - 'docs/content/building-gormes/architecture_plan/progress.json'
      - 'www.gormes.ai/internal/site/data/progress.json'
      - 'www.gormes.ai/Makefile'
      - 'benchmarks.json'
      - 'www.gormes.ai/internal/site/data/benchmarks.json'
  push:
    branches: [main, development]
    paths:
      - 'docs/content/building-gormes/architecture_plan/progress.json'
      - 'www.gormes.ai/internal/site/data/progress.json'
      - 'www.gormes.ai/Makefile'
      - 'benchmarks.json'
      - 'www.gormes.ai/internal/site/data/benchmarks.json'

permissions:
  contents: read

concurrency:
  group: www-mirror-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror-in-sync:
    name: mirror-in-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run www mirror sync
        run: |
          cd www.gormes.ai
          make build

      - name: Verify mirror matches canonical
        env:
          GIT_PAGER: cat
        run: |
          git diff --exit-code www.gormes.ai/internal/site/data/progress.json
          git diff --exit-code www.gormes.ai/internal/site/data/benchmarks.json
