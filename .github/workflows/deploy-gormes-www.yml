name: Deploy gormes.ai

on:
  push:
    branches: [main]
    paths:
      - 'webpages/landing/**'
      - 'benchmarks.json'
      - 'webpages/docs/content/building-gormes/architecture_plan/progress.json'
      - 'scripts/install.ps1'
      - 'scripts/install.cmd'
      - 'cmd/gormes/version.go'
      - '.github/workflows/deploy-gormes-www.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gormes-agent-landing-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'TrebuchetDynamics/gormes-agent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webpages/landing/package-lock.json

      - name: Install dependencies
        working-directory: webpages/landing
        run: npm ci

      - name: Refresh benchmark input
        run: |
          version=$(grep 'var Version =' cmd/gormes/version.go | sed 's/.*"\(.*\)".*/\1/')
          git_commit="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          if git diff --quiet 2>/dev/null && git diff --cached --quiet 2>/dev/null; then
            git_dirty=false
          else
            git_dirty=true
          fi
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.Version=${version} -X main.GitCommit=${git_commit} -X main.GitDirty=${git_dirty}" -o bin/gormes ./cmd/gormes

      - name: Build Astro static site
        working-directory: webpages/landing
        env:
          GORMES_WWW_REFRESH_BENCHMARKS: '1'
        run: npm run build

      - name: Verify build artifacts
        working-directory: webpages/landing
        run: |
          test -f dist/index.html
          test ! -e dist/install.sh
          test -f dist/install.ps1
          test -f dist/install.cmd
          test -f dist/static/favicon.ico
          test -f dist/static/social-card.png
          test -f dist/static/go-gopher-bear-lowpoly.png
          test -d dist/_astro

      - name: Verify homepage content
        working-directory: webpages/landing
        run: |
          grep -F 'data-site-runtime="astro-tailwind"' dist/index.html >/dev/null
          grep -F "Run AI agents from a single binary." dist/index.html >/dev/null
          grep -F "Systematic porting with full test coverage." dist/index.html >/dev/null
          grep -F "HOW IT&#39;S BUILT" dist/index.html >/dev/null
          grep -F "30 Hermes skills" dist/index.html >/dev/null
          grep -F "Validated rows shipped" dist/index.html >/dev/null
          grep -F "Current scout release:" dist/index.html >/dev/null
          grep -F "Runtime-ready" dist/index.html >/dev/null
          grep -F 'href="/static/favicon.ico"' dist/index.html >/dev/null
          grep -F 'property="og:image" content="https://gormes.ai/static/social-card.png"' dist/index.html >/dev/null
          grep -F '/static/go-gopher-bear-lowpoly.png' dist/index.html >/dev/null
          ! grep -F "Gormes 0.1.0" dist/index.html >/dev/null
          ! grep -F "AI agent runtime in one Go binary." dist/index.html >/dev/null
          ! grep -F "An autonomous engineering loop ports Hermes to Go, every day." dist/index.html >/dev/null
          ! grep -F "Hermes-Compatible AI Agent Runtime in One Go Binary" dist/index.html >/dev/null
          ! grep -F "Drop-in compatible with the Hermes agent ecosystem" dist/index.html >/dev/null
          ! grep -F "Run Agents From One Go Binary." dist/index.html >/dev/null
          ! grep -F "Run AI agents from one Go binary." dist/index.html >/dev/null
          ! grep -F "Gormes runs AI agents as a single static binary." dist/index.html >/dev/null
          ! grep -F "Run AI Agents as One Go Binary." dist/index.html >/dev/null
          ! grep -F "Gormes runs local agent sessions, provider turns, memory, dashboards, and chat gateways from one Go binary." dist/index.html >/dev/null
          ! grep -F "One static binary. No Python runtime. No Hermes process." dist/index.html >/dev/null
          ! grep -F "One Go Binary. No Python. No Drift." dist/index.html >/dev/null
          ! grep -F "Same Hermes Brain" dist/index.html >/dev/null
          ! grep -F "Why a Go layer matters" dist/index.html >/dev/null
          grep -F "https://github.com/TrebuchetDynamics/gormes-agent/releases/latest/download/install.sh" dist/index.html >/dev/null
          ! grep -E 'https://gormes[.]ai/install[.]sh' dist/index.html >/dev/null
          ! grep -F "curl -fsSL https://raw.githubusercontent.com/TrebuchetDynamics/gormes-agent/main/install.sh | sh" dist/index.html >/dev/null
          ! grep -F "brew install trebuchet/gormes" dist/index.html >/dev/null

      - name: Ensure Pages project exists
        # Pages project is expected to already exist (bound to gormes.ai).
        # This step is idempotent — wrangler returns 409 if the project
        # is already there; continue-on-error keeps the workflow healthy.
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create gormes-agent-landing --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy webpages/landing/dist --project-name=gormes-agent-landing --branch=main --commit-dirty=true

      - name: Attach gormes.ai
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          for domain in gormes.ai www.gormes.ai; do
            echo "attaching ${domain}"
            response=$(curl -sS -o /tmp/cf-resp.json -w "%{http_code}" -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/gormes-agent-landing/domains" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"${domain}\"}")
            case "$response" in
              200|201) echo "attached" ;;
              409|400) echo "already attached (status $response); skipping" ;;
              *) echo "unexpected status $response"; cat /tmp/cf-resp.json ;;
            esac
          done
