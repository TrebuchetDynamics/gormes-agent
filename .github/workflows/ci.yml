name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            webpages/docs/package-lock.json
            webpages/blog/package-lock.json
            webpages/landing/package-lock.json

      - name: Download modules
        run: go mod download

      - name: Install docs dependencies
        working-directory: webpages/docs
        run: npm ci

      - name: Install blog dependencies
        working-directory: webpages/blog
        run: npm ci

      - name: Install landing dependencies
        working-directory: webpages/landing
        run: npm ci

      - name: Run Go tests
        run: go test ./... -count=1

      - name: Run core race tests
        run: go test -race ./internal/kernel ./internal/gateway ./internal/adapters/channels/navivox ./internal/adapters/apiserver -count=1

      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

      - name: Test engineering blog
        working-directory: webpages/blog
        run: npm run test

      - name: Build docs site
        working-directory: webpages/docs
        run: npm run build

      - name: Test landing data and asset sync
        working-directory: webpages/landing
        run: npm run test:data && npm run test:sync-assets

      - name: Build landing site
        working-directory: webpages/landing
        run: npm run build

      - name: Smoke install dry-run
        run: bash tests/install/e2e.sh plan_dryrun_inside_sandbox

      - name: Validate progress
        run: go run ./cmd/progress validate

      - name: Check tracked local agent artifacts
        shell: bash
        run: |
          set -euo pipefail
          tracked=$(git ls-files 'internal/**/.pi/**' 'cmd/**/.pi/**' 'webpages/**/.pi/**' | while IFS= read -r path; do
            if [ -e "$path" ]; then
              printf '%s\n' "$path"
            fi
          done)
          if [ -n "$tracked" ]; then
            echo "::error title=Tracked local agent artifacts::Remove tracked .pi local-state files:"
            printf '%s\n' "$tracked"
            exit 1
          fi

      - name: Check whitespace
        run: git diff --check

  navivox:
    name: navivox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test Navivox Go gateway
        run: go test ./internal/adapters/channels/navivox -count=1
