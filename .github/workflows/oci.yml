name: OCI Image

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - docker/**
      - .github/workflows/oci.yml
      - .github/actions/gormes-oci-smoke/**
      - go.mod
      - go.sum
      - cmd/**
      - internal/**
      - webpages/docs/install/**
  push:
    branches: [main, development]
    paths:
      - Dockerfile
      - docker/**
      - .github/workflows/oci.yml
      - .github/actions/gormes-oci-smoke/**
      - go.mod
      - go.sum
      - cmd/**
      - internal/**
      - webpages/docs/install/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-amd64:
    name: build amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: linux/amd64
          tags: gormes-agent:oci-amd64-${{ github.sha }}
          cache-from: type=gha,scope=oci-amd64
          cache-to: type=gha,mode=max,scope=oci-amd64

      - name: Smoke image
        uses: ./.github/actions/gormes-oci-smoke
        with:
          image: gormes-agent:oci-amd64-${{ github.sha }}

  build-arm64:
    name: build arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: linux/arm64
          tags: gormes-agent:oci-arm64-${{ github.sha }}
          cache-from: type=gha,scope=oci-arm64
          cache-to: type=gha,mode=max,scope=oci-arm64

      - name: Smoke image
        uses: ./.github/actions/gormes-oci-smoke
        with:
          image: gormes-agent:oci-arm64-${{ github.sha }}
