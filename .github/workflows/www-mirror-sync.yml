name: www mirror sync check

on:
  pull_request:
    paths:
      - 'webpages/docs/content/building-gormes/architecture_plan/progress.json'
      - 'webpages/landing/legacy/go-renderer/internal/site/data/progress.json'
      - 'webpages/landing/scripts/sync-assets.mjs'
      - 'benchmarks.json'
      - 'webpages/landing/src/data/benchmarks.json'
      - 'cmd/gormes/version.go'
      - 'webpages/landing/src/data/release.json'
  push:
    branches: [main, development]
    paths:
      - 'webpages/docs/content/building-gormes/architecture_plan/progress.json'
      - 'webpages/landing/legacy/go-renderer/internal/site/data/progress.json'
      - 'webpages/landing/scripts/sync-assets.mjs'
      - 'benchmarks.json'
      - 'webpages/landing/src/data/benchmarks.json'
      - 'cmd/gormes/version.go'
      - 'webpages/landing/src/data/release.json'

permissions:
  contents: read

concurrency:
  group: www-mirror-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror-in-sync:
    name: mirror-in-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webpages/landing/package-lock.json

      - name: Install dependencies
        working-directory: webpages/landing
        run: npm ci

      - name: Run www mirror sync
        run: |
          cd webpages/landing
          npm run prebuild

      - name: Verify mirror matches canonical
        env:
          GIT_PAGER: cat
        run: |
          git diff --exit-code webpages/landing/legacy/go-renderer/internal/site/data/progress.json
          git diff --exit-code webpages/landing/src/data/benchmarks.json
          git diff --exit-code webpages/landing/src/data/release.json
