name: install-e2e

# Manual trigger only. The install e2e suite hits github.com (api + raw HTTPS),
# downloads the latest release binary, and exercises shell-script behaviors
# that don't fit the Go test runner. Wiring it into every push would slow CI
# and create flakes whenever github.com is degraded. Run on demand from the
# Actions tab when validating a release candidate or after touching install.sh.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "branch or commit SHA to test"
        required: false
        default: "development"
      keep_sandbox:
        description: "keep /tmp sandbox dirs after success (for log upload)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  e2e:
    name: install.sh e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Run install.sh e2e probes
        env:
          GORMES_INSTALL_E2E_KEEP: ${{ inputs.keep_sandbox == 'true' && '1' || '' }}
        run: bash tests/install/e2e.sh

      - name: Upload sandbox logs on failure
        if: failure() || inputs.keep_sandbox == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: install-e2e-sandbox
          path: /tmp/gormes-install-e2e/
          if-no-files-found: ignore
          retention-days: 7
