name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            webpages/docs/package-lock.json
            webpages/blog/package-lock.json

      - name: Download modules
        run: go mod download

      - name: Install docs dependencies
        working-directory: webpages/docs
        run: npm ci

      - name: Install blog dependencies
        working-directory: webpages/blog
        run: npm ci

      - name: Run Go tests
        run: go test ./... -count=1

      - name: Test engineering blog
        working-directory: webpages/blog
        run: npm run test

      - name: Validate progress
        run: go run ./cmd/progress validate

      - name: Check whitespace
        run: git diff --check

  navivox:
    name: navivox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true

      - name: Test Navivox Go gateway
        run: go test ./internal/channels/navivox -count=1

      - name: Install Navivox Flutter dependencies
        working-directory: flutter-navivox/app
        run: flutter pub get

      - name: Analyze Navivox Flutter app
        working-directory: flutter-navivox/app
        run: flutter analyze

      - name: Test Navivox Flutter app
        working-directory: flutter-navivox/app
        run: flutter test

      - name: Test Navivox Chrome e2e
        working-directory: flutter-navivox/app
        run: flutter test --platform chrome test/e2e/connect_and_talk_web_e2e_test.dart

      - name: Build Navivox web
        working-directory: flutter-navivox/app
        run: flutter build web --no-web-resources-cdn
