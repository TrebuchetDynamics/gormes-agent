name: Release Preparation

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Prerelease suffix (e.g., scout, rc1). Leave empty for stable.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: prepare release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve next version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current=$(grep 'var Version =' cmd/gormes/version.go | sed 's/.*"\(.*\)".*/\1/')
          echo "current=$current"

          # Parse current version (e.g., 0.1.0 or 0.2.0-scout -> 0.1.0/0.2.0)
          base="${current%%-*}"
          IFS='.' read -r major minor patch <<< "$base"

          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          next="${major}.${minor}.${patch}"
          if [ -n "${{ inputs.prerelease }}" ]; then
            next="${next}-${{ inputs.prerelease }}"
          fi

          echo "next=$next"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Validate before bump
        run: |
          go test ./... -count=1
          go run ./cmd/progress validate
          git diff --check

      - name: Bump version in source
        run: |
          sed -i 's/var Version = ".*"/var Version = "${{ steps.version.outputs.next }}"/' cmd/gormes/version.go

      - name: Update CHANGELOG.md
        run: |
          next="${{ steps.version.outputs.next }}"
          date=$(date +%Y-%m-%d)

          # Add new section after the Unreleased header
          awk -v ver="$next" -v dt="$date" '
            /## \[Unreleased\]/ {
              print
              print ""
              print "## [" ver "] - " dt
              next
            }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.tmp && mv CHANGELOG.md.tmp CHANGELOG.md

          # Update comparison links at the bottom from the resolved source version.
          previous="${{ steps.version.outputs.current }}"
          sed -i "s|compare/v${previous}...HEAD|compare/v${next}...HEAD|" CHANGELOG.md
          echo "[${next}]: https://github.com/TrebuchetDynamics/gormes-agent/compare/v${previous}...v${next}" >> CHANGELOG.md

      - name: Regenerate progress docs
        run: go run ./cmd/progress write

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: release/${{ steps.version.outputs.next }}
          title: 'release: ${{ steps.version.outputs.next }}'
          body: |
            ## Release ${{ steps.version.outputs.next }}

            This PR was automatically generated by the release preparation workflow.

            ### Checklist
            - [ ] Review CHANGELOG.md entries
            - [ ] Verify version bump in `cmd/gormes/version.go`
            - [ ] Confirm all tests pass
            - [ ] Merge this PR to trigger the release workflow

            After merging, create and push a tag:
            ```bash
            git checkout main
            git pull
            git tag -a v${{ steps.version.outputs.next }} -m "Release ${{ steps.version.outputs.next }}"
            git push origin v${{ steps.version.outputs.next }}
            ```
          commit-message: 'release: bump version to ${{ steps.version.outputs.next }}'
          base: main
